# Render Blueprint Specification
# Docs: https://render.com/docs/blueprint-spec
# Service: oorja-backend-kevf (existing paid/starter service on Render)

services:
  - type: web
    name: oorja-backend
    runtime: docker
    dockerContext: ./oorja/be
    dockerfilePath: ./oorja/be/Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@oorjaonmove.com
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.vercel.app,https://fe-nine-sigma.vercel.app,https://oorja-on-move.vercel.app,http://localhost:5173"
      - key: GOOGLE_CLIENT_ID
        value: "102477450077-vsjtr7r2tdnne44bthtg6qtqnh27jgce.apps.googleusercontent.com"
      - key: RAZORPAY_KEY_ID
        value: rzp_test_U3IO89Q2YmpVjo
      - key: RAZORPAY_KEY_SECRET
        value: W01ZMkbY9OSWsqxy8fCXur2D
      - key: RAZORPAY_WEBHOOK_SECRET
        generateValue: true
      - key: STORAGE_PROVIDER
        value: local
      - key: UPLOAD_DIR
        value: /tmp/oorja-uploads
      - key: CLOUDFLARE_R2_BUCKET
        value: oorja-uploads
      - key: CLOUDFLARE_R2_REGION
        value: auto
      - key: CLOUDFLARE_R2_ENDPOINT
        value: ""
      - key: CLOUDFLARE_R2_ACCESS_KEY
        value: ""
      - key: CLOUDFLARE_R2_SECRET_KEY
        value: ""
      - key: CLOUDFLARE_R2_PUBLIC_URL_PREFIX
        value: ""
      # ---------- Brevo SMTP (OTP emails from info@oorjaonmove.com) ----------
      - key: MAIL_ENABLED
        value: "true"
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        value: info@oorjaonmove.com
      - key: MAIL_FROM
        value: info@oorjaonmove.com
      - key: MAIL_PASSWORD
        sync: false
      - key: OTP_LOG_TO_CONSOLE
        value: "false"
      # Keep bypass active for staging tests; set to empty string to disable
      - key: OTP_BYPASS_CODE
        value: "123456"
      - key: DB_HOST
        fromDatabase:
          name: oorja-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: oorja-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: oorja-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: oorja-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: oorja-db
          property: password

databases:
  - name: oorja-db
    plan: starter
    databaseName: oorja_db
    user: oorja_user
    region: oregon
