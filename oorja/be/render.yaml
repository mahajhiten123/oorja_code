# Render Blueprint — defines the backend web service and its PostgreSQL database.
# Deploy by connecting this repo to Render and pointing it at this file, or
# just use the Render dashboard and copy the env var names from here.
#
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: oorja-backend
    runtime: docker
    dockerfilePath: ./oorja/be/Dockerfile
    # Render sets PORT automatically; Spring Boot reads ${PORT:8080}
    plan: free
    healthCheckPath: /api/customer/services
    envVars:
      - key: JWT_SECRET
        sync: false           # Must be set manually in Render dashboard
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        value: admin@oorjaonmove.com
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false           # Set to your GitHub Pages URL after first deploy
      - key: STORAGE_PROVIDER
        value: local
      - key: UPLOAD_DIR
        value: /tmp/oorja-uploads
      - key: MAIL_ENABLED
        value: "false"        # Flip to true and add SMTP vars when ready
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: oorja-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: oorja-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: oorja-db
          property: password

databases:
  - name: oorja-db
    plan: free
    databaseName: oorja_db
    user: oorja_user
