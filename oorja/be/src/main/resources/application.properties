# =========================================================
# Oorja on Move - Backend Configuration
# All secrets are read from environment variables with sane
# local-dev defaults. Override via env vars in production.
# =========================================================

spring.application.name=oorja-backend
server.port=${SERVER_PORT:8080}

# ---------- CORS ----------
# REQUIRED, no default: comma-separated list of exact origins allowed to make
# credentialed requests, e.g. https://app.oorjaonmove.com,https://admin.oorjaonmove.com
# Never "*" - see SecurityConfig.corsConfigurationSource(). For local dev,
# point this at your Vite/CRA dev server origin(s).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ---------- PostgreSQL ----------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:oorja_db}
spring.datasource.username=${DB_USERNAME:oorja_user}
spring.datasource.password=${DB_PASSWORD:oorja_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------- Connection pool (HikariCP) ----------
# Spring Boot's default of 10 connections queues most requests behind the
# pool under real concurrency (e.g. 100 concurrent booking/OTP requests),
# which shows up as slow or intermittently-timing-out responses rather than
# an outright error. Tune these to your actual DB's max_connections and
# expected concurrent load, and load-test before trusting a number here -
# the values below are a reasonable starting point, not a guarantee.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:30}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:10}
# How long a request will wait for a pooled connection before failing with
# a clean error, instead of Hikari's 30s default.
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:300000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.pool-name=OorjaHikariPool
# Fail fast on startup if the pool can't get a first connection, rather than
# accepting traffic against a DB that isn't actually reachable.
spring.datasource.hikari.initialization-fail-timeout=1

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

# ---------- Flyway (schema + seed data) ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ---------- Admin console (shared-password login) ----------
# REQUIRED, no default: the app refuses to start without a strong value here
# (see SecurityStartupValidator). Generate a long random password and set it
# only via the ADMIN_PASSWORD env var - never commit a real value.
app.admin.password=${ADMIN_PASSWORD:}
app.admin.email=${ADMIN_EMAIL:admin@oorjaonmove.com}

# ---------- File storage (booking site photos / documents) ----------
# Where uploaded files actually live. The database only ever stores a
# storage_key; these settings decide what resolves it.
#
#   local -> LocalStorageProvider, writes under app.upload.dir.
#            Dev / single-server only: files are lost if the box is replaced
#            and are invisible to a second app server.
#   s3    -> S3StorageProvider. Use this in production. Works with AWS S3,
#            Cloudflare R2, MinIO, or any S3-compatible bucket.
app.storage.provider=${STORAGE_PROVIDER:local}

# Local provider only.
app.upload.dir=${UPLOAD_DIR:uploads}

# S3 provider only (required when app.storage.provider=s3).
# Cloudflare R2 example:
#   STORAGE_S3_ENDPOINT=https://<account-id>.r2.cloudflarestorage.com
#   STORAGE_S3_REGION=auto
# AWS S3: leave the endpoint blank and set a real region (e.g. ap-south-1).
# Keep the bucket PRIVATE - files are streamed through our own authenticated
# endpoints so booking-ownership checks still apply.
app.storage.s3.bucket=${STORAGE_S3_BUCKET:}
app.storage.s3.region=${STORAGE_S3_REGION:auto}
app.storage.s3.endpoint=${STORAGE_S3_ENDPOINT:}
app.storage.s3.access-key=${STORAGE_S3_ACCESS_KEY:}
app.storage.s3.secret-key=${STORAGE_S3_SECRET_KEY:}
# R2 and MinIO require path-style addressing; AWS S3 accepts it too.
app.storage.s3.path-style=${STORAGE_S3_PATH_STYLE:true}

# ---------- Attachment deletion ----------
# Deletes are soft: the row survives as the audit record (who/when/why) and the
# stored object is destroyed only after this retention window, so an accidental
# delete stays recoverable until then.
app.attachments.retention-days=${ATTACHMENT_RETENTION_DAYS:30}
app.attachments.purge-cron=${ATTACHMENT_PURGE_CRON:0 15 3 * * *}
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=60MB

# ---------- JWT ----------
# REQUIRED, no default: the app refuses to start without a strong (32+ char,
# random) value here (see SecurityStartupValidator). Never commit a real
# value - set it only via the JWT_SECRET env var.
app.jwt.secret=${JWT_SECRET:}
# Access token lifetime: short by design (15 min default) since a stolen
# access token is a bearer credential with no server-side revocation check
# beyond its own expiry + the blacklist. Long-lived sessions are handled by
# the refresh token below instead.
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
# Refresh token lifetime (30 days default). Refresh tokens are rotated
# (single-use) and individually revocable - see RefreshTokenService.
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}

# ---------- OTP ----------
app.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:5}
app.otp.max-per-window=${OTP_MAX_PER_WINDOW:5}
app.otp.window-minutes=${OTP_WINDOW_MINUTES:15}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}

# ---------- Mail (SMTP) ----------
# Set app.mail.enabled=false for local dev to log OTPs instead of sending real emails.
app.mail.enabled=${MAIL_ENABLED:true}
# Prints the OTP to the console ONLY when ALL of: MAIL_ENABLED=false, the 'local' Spring profile is active, and this is true.
# Never honoured under prod/production. Default false.
app.otp.log-to-console=${OTP_LOG_TO_CONSOLE:false}
app.mail.from=${MAIL_FROM:info@oorjaonmove.com}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


# ---------- Google OAuth ----------
# OAuth 2.0 Client ID (Web application) from Google Cloud Console.
# Must match VITE_GOOGLE_CLIENT_ID used by the frontend.
google.client-id=${GOOGLE_CLIENT_ID:}

# ---------- Razorpay ----------
# Get these from Razorpay Dashboard > Settings > API Keys. NEVER commit real keys.
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_1234567890abcd}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
# Separate from key.secret above — this is the secret you set when creating the
# webhook in Razorpay Dashboard > Settings > Webhooks. Razorpay signs the raw
# webhook body with this (X-Razorpay-Signature), never with the API key secret.
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}

# ---------- Booking slots (Phase 3: slot/availability system) ----------
# Max bookings allowed per 2-hour slot on the published grid (09:00-17:00).
booking.slots.capacity=${BOOKING_SLOT_CAPACITY:4}
# Minimum notice required before a slot can be booked/rescheduled into.
booking.slots.min-lead-hours=${BOOKING_SLOT_MIN_LEAD_HOURS:2}
# A seat is claimed when the payment order is created, before the customer pays. An UNPAID order keeps it
# this long; the sweep below gives it back. A captured payment never loses its seat.
booking.slots.hold-minutes=${BOOKING_SLOT_HOLD_MINUTES:30}
booking.slots.hold-sweep-interval-ms=${BOOKING_SLOT_HOLD_SWEEP_MS:60000}

# ---------- Jackson ----------
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------- Logging ----------
logging.level.com.oorja.backend=${LOG_LEVEL:INFO}

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health

# =========================================================
# Refund engine — append this block to application.properties.
#
# Every threshold the policy engine uses lives here, so finance can change
# the cancellation terms without a code change. Values that applied to any
# past refund are already frozen on that refund's own row, so changing these
# never rewrites history.
# =========================================================

# ---------- Cancellation windows ----------
# Cancel this many hours or more before the slot: full refund.
refund.policy.full-refund-hours=${REFUND_FULL_HOURS:48}
# Between partial-refund-hours and full-refund-hours: partial tier.
refund.policy.partial-refund-hours=${REFUND_PARTIAL_HOURS:24}
# Inside this many hours of the slot, a cancellation also needs a human.
refund.policy.late-window-hours=${REFUND_LATE_WINDOW_HOURS:2}

# ---------- Percentages, in basis points (10000 = 100%) ----------
refund.policy.partial-percent-bps=${REFUND_PARTIAL_BPS:7500}
refund.policy.late-percent-bps=${REFUND_LATE_BPS:5000}
refund.policy.no-show-percent-bps=${REFUND_NO_SHOW_BPS:0}

# ---------- Flat deductions, in paise ----------
# Kept when a technician was already dispatched (₹199 by default).
refund.policy.dispatched-visit-fee-paise=${REFUND_VISIT_FEE_PAISE:19900}
refund.policy.late-cancellation-fee-paise=${REFUND_LATE_FEE_PAISE:0}
# Non-refundable gateway charge passed on to the customer. Off by default —
# turning this on changes what customers are quoted, so treat it as a pricing
# decision, not a config tweak.
refund.policy.gateway-fee-paise=${REFUND_GATEWAY_FEE_PAISE:0}
# Below this, pay nothing rather than dust that costs more to reconcile.
refund.policy.minimum-payout-paise=${REFUND_MIN_PAYOUT_PAISE:100}

# ---------- Approval ----------
# Full refunds at or below this go straight through with no human (₹5,000).
refund.policy.auto-approve-max-paise=${REFUND_AUTO_APPROVE_MAX_PAISE:500000}
# Anything caused by us is auto-approved regardless of size.
refund.policy.auto-approve-provider-fault=${REFUND_AUTO_APPROVE_PROVIDER_FAULT:true}

# ---------- Gateway ----------
refund.policy.request-window-days=${REFUND_WINDOW_DAYS:180}
refund.policy.settlement-days=${REFUND_SETTLEMENT_DAYS:7}
refund.policy.max-gateway-attempts=${REFUND_MAX_ATTEMPTS:5}
refund.policy.retry-backoff-minutes=${REFUND_RETRY_BACKOFF_MIN:15}
refund.policy.reconcile-stale-after-minutes=${REFUND_STALE_AFTER_MIN:30}

# Rescheduling always preserves the full amount paid. This is what makes the
# "move it instead" option genuinely better for the customer.
refund.policy.rebooking-keeps-full-value=${REFUND_REBOOK_FULL_VALUE:true}

# ---------- Background jobs ----------
# Push approved refunds to the gateway.
refund.jobs.dispatch-interval-ms=${REFUND_DISPATCH_INTERVAL_MS:60000}
# Poll the provider for refunds no webhook ever confirmed.
refund.jobs.poll-interval-ms=${REFUND_POLL_INTERVAL_MS:300000}
# Nightly books-balancing pass (02:30).
refund.jobs.audit-cron=${REFUND_AUDIT_CRON:0 30 2 * * *}

# =========================================================
# Documents (invoices, service reports) and support ticketing
# =========================================================

# ---------- Who the documents are from ----------
# These print on every invoice and service report, and in the footer of
# every branded customer email (phone/email are the "contact us" line).
# The legal name, address and GSTIN are compliance details, not cosmetics —
# set them before going live.
app.company.name=${COMPANY_NAME:Oorja on Move}
app.company.legal-name=${COMPANY_LEGAL_NAME:Oorja on Move Pvt. Ltd.}
app.company.address-line1=${COMPANY_ADDRESS1:}
app.company.address-line2=${COMPANY_ADDRESS2:}
app.company.city=${COMPANY_CITY:}
app.company.state=${COMPANY_STATE:}
app.company.pincode=${COMPANY_PINCODE:}
app.company.gstin=${COMPANY_GSTIN:}
app.company.phone=${COMPANY_PHONE:+91 97884 95584}
app.company.email=${COMPANY_EMAIL:info@oorjaonmove.com}
app.company.website=${COMPANY_WEBSITE:oorjaonmove.com}
# Must match PricingService.GST_PCT (0.18 = 1800 bps).
app.company.tax-rate-bps=${COMPANY_TAX_RATE_BPS:1800}

# ---------- Frontend ----------
# Where the CTA button in branded customer emails (View quotation, Download
# receipt, etc.) links to. Point this at the real app origin in production.
app.frontend.base-url=${FRONTEND_BASE_URL:https://oorjaonmove.com}

# Hourly sweep that issues invoices for any captured payment that somehow
# never had one requested.
app.invoices.sweep-cron=${INVOICE_SWEEP_CRON:0 15 * * * *}

# ---------- Support ----------
# Where new tickets are emailed. Falls back to app.mail.from when blank.
app.mail.support-inbox=${SUPPORT_INBOX:}
