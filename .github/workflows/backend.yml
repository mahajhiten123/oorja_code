name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'oorja/be/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'oorja/be/**'
      - '.github/workflows/backend.yml'

# Allow only one concurrent deployment; cancel in-progress runs on new pushes.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/oorja-backend

jobs:
  # ─── Test & Build ───────────────────────────────────────────────────────────
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oorja/be

    # Spin up PostgreSQL so integration tests can run against a real database.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: oorja_test
          POSTGRES_USER: oorja_user
          POSTGRES_PASSWORD: oorja_test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        env:
          # Minimal env so the app can start for integration tests.
          JWT_SECRET: ci-test-secret-must-be-at-least-32-chars-long!!
          ADMIN_PASSWORD: CiTestAdminPass@99
          ADMIN_EMAIL: ci@test.com
          CORS_ALLOWED_ORIGINS: http://localhost:5173
          MAIL_ENABLED: "false"
          OTP_LOG_TO_CONSOLE: "true"
          STORAGE_PROVIDER: local
          UPLOAD_DIR: /tmp/oorja-ci-uploads
          RAZORPAY_KEY_ID: rzp_test_placeholder
          RAZORPAY_KEY_SECRET: placeholder_secret
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/oorja_test
          SPRING_DATASOURCE_USERNAME: oorja_user
          SPRING_DATASOURCE_PASSWORD: oorja_test_pass
        run: mvn verify -B

      - name: Package JAR (skip tests — already ran above)
        run: mvn package -DskipTests -B

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: oorja-backend-jar
          path: oorja/be/target/oorja-backend.jar
          retention-days: 1

  # ─── Docker Build & Push (main only) ───────────────────────────────────────
  docker:
    name: Docker Build & Push
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: oorja/be
          file: oorja/be/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy to Render (main only) ──────────────────────────────────────────
  deploy:
    name: Deploy to Render
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deploy hook
        run: |
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" \
            -H "Accept: application/json" \
            --fail-with-body
