name: Frontend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'oorja/fe/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'oorja/fe/**'
      - '.github/workflows/frontend.yml'

# Allow only one concurrent deployment; cancel in-progress runs on new pushes.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Build ─────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oorja/fe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: oorja/fe/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check & build
        env:
          # GitHub Pages serves from /oorja_code/ — set the base URL here.
          VITE_BASE: /oorja_code/
          # Backend URL injected at build time from GitHub Secrets.
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID }}
        run: npm run build

      # Copy index.html → 404.html so GitHub Pages serves the SPA on unknown paths
      - name: Fix SPA routing for GitHub Pages
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        # Only upload on pushes to main (not on PRs)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: oorja/fe/dist

  # ─── Deploy (main only) ────────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
